name: Build APK from ZIP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Project ZIP if present
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d unpacked_proj
            if [ -f "unpacked_proj/gradlew" ]; then
              cp -r unpacked_proj/* .
            elif [ -f "unpacked_proj/cardpulse-crm/gradlew" ]; then
              cp -r unpacked_proj/cardpulse-crm/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardPulse-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
